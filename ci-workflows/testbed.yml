name: testbed (Mininet + Ryu)

# Best-effort run of the REAL data-plane testbed on a GitHub Ubuntu 22.04 runner:
#   Mininet 2.3.0 + Open vSwitch + Ryu (OF 1.3) + Scapy 2.5.0 + hping3 + iperf3.
#
# GitHub runners allow sudo and ship the OVS kernel datapath, so Mininet works;
# Ryu on Python 3.10 is fragile (eventlet / distutils), so the whole job is
# `continue-on-error: true` -- a red X here does NOT fail the reproduction, it
# just means the live testbed did not come up in CI. The pure-Python
# `reproduce` workflow is the authoritative one.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'topology/**'
      - 'controller/**'
      - 'attacks/**'
      - 'traffic/iperf_generator.py'
      - 'traffic/socket_generator.py'
      - 'scripts/run_testbed.sh'
      - '.github/workflows/testbed.yml'

jobs:
  testbed:
    runs-on: ubuntu-22.04           # [PAPER] Ubuntu 22.04 LTS
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show kernel / OS (paper: Ubuntu 22.04, kernel 5.15)
        run: uname -a && lsb_release -a || true

      - name: Install Mininet / OVS / attack tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mininet openvswitch-switch openvswitch-common \
            iperf3 hping3 python3.10 python3.10-venv python3-pip
          sudo systemctl start openvswitch-switch || sudo service openvswitch-switch start || true
          ovs-vsctl --version | head -1
          mn --version

      - name: Python deps (paper pins + os-ken/Scapy)
        run: |
          python3.10 -m pip install --upgrade pip
          python3.10 -m pip install -r requirements.txt
          # requirements-testbed.txt defaults to os-ken (the maintained Ryu fork;
          # Ryu 4.34 no longer builds on modern toolchains). controller/__init__.py
          # aliases ryu.* -> os_ken.* transparently.
          python3.10 -m pip install -r requirements-testbed.txt
          python3.10 -c "import controller; print('SDN backend:', controller.SDN_BACKEND)"

      - name: Train the model (needed by the controller)
        run: python3.10 -m ml.train_rf

      - name: Smoke-test the Mininet topology (Fig 2)
        run: sudo python3.10 topology/topology.py --test

      - name: Run the live testbed (300 s window, attacks at t=60 / t=120)
        run: |
          sudo env "PATH=$PATH" PYTHON=python3.10 timeout 900 ./scripts/run_testbed.sh 300 || \
            echo "::warning::run_testbed.sh exited non-zero (see logs)"
          echo "---- Ryu log ----"; tail -n 200 /tmp/ryu.log || true
          echo "---- telemetry ----"; ls -la results/testbed/ || true

      - name: Upload testbed telemetry + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testbed-telemetry
          path: |
            results/testbed/**
            /tmp/ryu.log
          if-no-files-found: warn
          retention-days: 14
