# =============================================================================
# topology.yaml -- Enterprise Network Topology Testbed  (Fig 2, Sec III.B, IV.B)
# =============================================================================
# G = (V, E, W),  V = H u S u {C}
#   1 Core OpenFlow switch  (s_core)
#   3 Edge OpenFlow switches (s1, s2, s3)
#   13 host endpoints        (h1 .. h13)
#
# Tags:  (see experiment.yaml header / MODELING_NOTES.md)
# =============================================================================

controller:
  name: "c0"
  framework: "ryu"                # 
  openflow_version: "1.3"         # 
  listen_ip: "127.0.0.1"         # local testbed. MODELING_NOTES.md #4
  listen_port: 6653              # Ryu/OF1.3 default. MODELING_NOTES.md #4

# Uniform link parameters (Sec IV.B)
links:
  bandwidth_mbps: 100            # "uniform bandwidth capacity of 100 Mbps"
  delay_ms: 1.0                  # "propagation delay of 1.0 ms"
  loss_pct: 0.0                  # "0% artificial packet loss rate"
  max_queue_size: 1000          # Mininet TCLink default-ish; affects transient buffering only. MODELING_NOTES.md #5

switches:
  s_core: { dpid: 1, role: "core" }                       # "1 Core OpenFlow switch (s_core)"
  s1:     { dpid: 2, role: "edge", segment: "S1" }        # 
  s2:     { dpid: 3, role: "edge", segment: "S2" }        # 
  s3:     { dpid: 4, role: "edge", segment: "S3" }        # 

# Core <-> edge fabric (star through the core). "1 Core ... 3 Edge switches"
switch_links:
  - [s_core, s1]
  - [s_core, s2]
  - [s_core, s3]

# -----------------------------------------------------------------------------
# Host endpoints  (Sec IV.B)
#   name, switch, role                       -> 
#   ip, mac, base_vlan                       ->  (MODELING_NOTES.md #2, #3)
# -----------------------------------------------------------------------------
ip_plan:
  subnet: "10.0.0.0/24"          # paper gives no addressing. MODELING_NOTES.md #2
  host_ip_format: "10.0.0.{n}"   # h{n} -> 10.0.0.{n}
  mac_format: "00:00:00:00:00:{n:02x}"   # 
  segment_base_vlan:             # base microsegmentation VLANs; paper only fixes the quarantine VLAN (99)
    S1: 10
    S2: 20
    S3: 30
quarantine_vlan: 99              # Sec III.D / Algorithm 1 line 11 / Sec V.A.4

hosts:
  # --- Edge Switch S1 Segment (Sec IV.B) ---
  h1:  { switch: s1, ip: "10.0.0.1",  mac: "00:00:00:00:00:01", base_vlan: 10, role: "finance",            server: false }   # Finance
  h2:  { switch: s1, ip: "10.0.0.2",  mac: "00:00:00:00:00:02", base_vlan: 10, role: "hr_server",          server: true  }   # HR
  h3:  { switch: s1, ip: "10.0.0.3",  mac: "00:00:00:00:00:03", base_vlan: 10, role: "application_server", server: true  }   # Application Server
  h4:  { switch: s1, ip: "10.0.0.4",  mac: "00:00:00:00:00:04", base_vlan: 10, role: "attacker",           server: false }   # Compromised Attacker Node

  # --- Edge Switch S2 Segment (Sec IV.B) ---
  h5:  { switch: s2, ip: "10.0.0.5",  mac: "00:00:00:00:00:05", base_vlan: 20, role: "database_server",    server: true  }   # Database Server
  h6:  { switch: s2, ip: "10.0.0.6",  mac: "00:00:00:00:00:06", base_vlan: 20, role: "web_server",         server: true  }   # Web Server
  h7:  { switch: s2, ip: "10.0.0.7",  mac: "00:00:00:00:00:07", base_vlan: 20, role: "workstation_emp1",   server: false }   # Workstation EMP 1
  h8:  { switch: s2, ip: "10.0.0.8",  mac: "00:00:00:00:00:08", base_vlan: 20, role: "workstation_emp2",   server: false }   # Workstation EMP 2

  # --- Edge Switch S3 Segment (Sec IV.B) : hosts h9 through h13 = departmental endpoints ---
  h9:  { switch: s3, ip: "10.0.0.9",  mac: "00:00:00:00:00:09", base_vlan: 30, role: "dept_dev",           server: false }   # DEV
  h10: { switch: s3, ip: "10.0.0.10", mac: "00:00:00:00:00:0a", base_vlan: 30, role: "dept_mkt",           server: false }   # MKT
  h11: { switch: s3, ip: "10.0.0.11", mac: "00:00:00:00:00:0b", base_vlan: 30, role: "dept_sales",         server: false }   # SALES
  h12: { switch: s3, ip: "10.0.0.12", mac: "00:00:00:00:00:0c", base_vlan: 30, role: "dept_guest",         server: false }   # GUEST
  h13: { switch: s3, ip: "10.0.0.13", mac: "00:00:00:00:00:0d", base_vlan: 30, role: "dept_admin",         server: false }   # ADMIN

# -----------------------------------------------------------------------------
# Security-relevant host sets
# -----------------------------------------------------------------------------
attacker_host: "h4"              # Sec IV.C.2

# F_critical : flows to business-critical services that must never be hard-dropped
# (Algorithm 1 line 8 routes these to a meter rule instead of a drop).
# the paper names "database services or active authentication servers"
# (Sec I) as the protected class; mapped here to the four server hosts. MODELING_NOTES.md #8
critical_hosts: ["h2", "h3", "h5", "h6"]

# F_lateral : east-west flows between internal endpoints (Algorithm 1 line 10 -> VLAN 99).
# any flow whose src and dst are both internal hosts (not a client->server
# service call on a well-known port) and that originates from a non-server host.
# The horizontal probe h4 -> {h2,h5} is the canonical lateral case (Sec IV.C.2). MODELING_NOTES.md #8
lateral_definition: "internal src+dst, non-service destination port, source is not a server"

# N(N-1) directed host-to-host paths used by the Network Availability metric (Sec IV.F.5)
host_count: 13                   # 
directed_path_count: 156         # 13 * 12
