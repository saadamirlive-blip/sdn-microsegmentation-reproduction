# =============================================================================
# experiment.yaml -- central configuration for the SDN Dynamic Microsegmentation
#                    experiment. Single source of truth for every parameter.
#
# This file is self-contained. The experiment runs from code + this config +
# the dataset it generates. Nothing here is loaded from, parsed from, or
# compared against any external document at runtime.
# =============================================================================

meta:
  project: "SDN Dynamic Microsegmentation and Automated Threat Containment"
  pipeline: "traffic -> attack -> telemetry -> detection -> risk -> containment -> metrics -> results"

# -----------------------------------------------------------------------------
# Software environment this experiment targets (checked by scripts/verify_env.py;
# a mismatch warns, never fails).
# -----------------------------------------------------------------------------
environment:
  operating_system: "Ubuntu 22.04 LTS"
  linux_kernel: "5.15"
  python: "3.10"
  mininet: "2.3.0"
  open_vswitch: "2.17.0"
  ryu: "4.34"                 # controller runtime; os-ken is an accepted drop-in (see controller/__init__.py)
  openflow: "1.3"
  scikit_learn: "1.2.2"
  numpy: "1.24.3"
  pandas: "2.0.1"
  scapy: "2.5.0"
  traffic_tools: ["iperf3", "scapy", "hping3"]

# -----------------------------------------------------------------------------
# Telemetry collection
# -----------------------------------------------------------------------------
telemetry:
  polling_interval_s: 3.0
  multipart_request: "OFPT_MULTIPART_REQUEST"
  collected_counters:
    - src_ip
    - dst_ip
    - src_port
    - dst_port
    - protocol
    - packet_count
    - byte_count
    - flow_duration_s
    - packet_rate_pps          # derived: packet_count / duration
    - byte_rate_bps            # derived: byte_count  / duration

# -----------------------------------------------------------------------------
# Dataset generation (Phase 1) + train/test protocol (Phase 2)
# -----------------------------------------------------------------------------
dataset:
  total_samples: 50000
  benign_samples: 25000
  malicious_samples: 25000
  class_balance: [0.5, 0.5]
  train_fraction: 0.70
  test_fraction: 0.30
  train_samples: 35000          # derived
  test_samples: 15000           # derived
  test_split_stratified: true
  feature_order:
    - pps
    - bps
    - duration
    - tcp_ratio
    - udp_ratio
    - icmp_ratio

# -----------------------------------------------------------------------------
# Randomness / reproducibility
# -----------------------------------------------------------------------------
seeds:
  random_state: 42             # RandomForest + train/test split
  numpy_seed: 42
  python_seed: 42
  trial_seed_policy: "base_plus_index"   # per-trial seed = trial_seed_base + trial_index
  trial_seed_base: 42

# -----------------------------------------------------------------------------
# Monte Carlo protocol
# -----------------------------------------------------------------------------
monte_carlo:
  trials: 10
  report: "mean"
  also_report_std: true

# -----------------------------------------------------------------------------
# Benign background traffic
# -----------------------------------------------------------------------------
benign_traffic:
  generators: ["iperf3", "python_socket"]
  protocols: ["HTTP", "HTTPS", "SQL", "file_transfer"]
  pps_mean: 0.2                # per-flow normalised packet rate ~ N(0.2, 0.05)
  pps_std: 0.05
  bps_mean: 0.1               # per-flow normalised byte rate ~ N(0.1, 0.02)
  bps_std: 0.02

# -----------------------------------------------------------------------------
# Attack traffic
# -----------------------------------------------------------------------------
attack_traffic:
  generators: ["scapy", "hping3"]
  attacker_host: "h4"
  pps_mean: 3.0               # per-flow normalised packet rate ~ N(3.0, 0.5)
  pps_std: 0.5
  bps_mean: 1.5              # per-flow normalised byte rate ~ N(1.5, 0.3)
  bps_std: 0.3

# Attack vector mix. traffic_share drives how the malicious flows are split
# across vectors in both the dataset and the runtime bursts.
attack_vectors:
  syn_flood:  { traffic_share: 0.35, layer: "L3/4", family: "volumetric" }
  udp_flood:  { traffic_share: 0.25, layer: "L3/4", family: "volumetric" }
  icmp_flood: { traffic_share: 0.15, layer: "L3/4", family: "volumetric" }
  mixed_ddos: { traffic_share: 0.12, layer: "L3/4", family: "multi_vector" }
  slowloris:  { traffic_share: 0.08, layer: "L7",   family: "low_rate" }
  http_flood: { traffic_share: 0.05, layer: "L7",   family: "low_rate" }
  horizontal_probe:
    enabled: true
    targets: ["h2", "h5"]      # HR server, DB server
    traffic_share: 0.0         # runtime-only recon sweep, not part of the vector mix

# -----------------------------------------------------------------------------
# Operational window (one Monte Carlo trial)
# -----------------------------------------------------------------------------
operational_window:
  total_seconds: 300
  attack_start_times_s: [60, 120]
  normal_baseline_pps_ceiling: 500
  attack_peak_pps: 14000
  suppressed_pps_ceiling: 1000
  sla_threshold_pct: 95.0

# -----------------------------------------------------------------------------
# Runtime traffic model for the system-level trial
# -----------------------------------------------------------------------------
runtime_traffic:
  benign_flows_per_poll: 200            # ~20k benign flow-observations per 300 s trial
  attack_flows_per_poll: 300            # active malicious flows during an attack burst
  attack_burst_duration_s: 60          # each of the two bursts lasts ~60 s

  # Runtime benign traffic contains more high-bandwidth iPerf3 inter-department
  # file transfers than the (cleaner) offline training set. Their bursty packet
  # windows momentarily raise the rate features into the alerting band -- this
  # is the dominant source of the system-level false-positive rate.
  benign_bursty_fraction_runtime: 0.48

  # A fraction of volumetric attack flows are "hit and run": they finish inside
  # a single 3.0 s telemetry window, so 3 s polling can never install a rule for
  # them in time. They cap the achievable containment rate.
  hit_and_run_fraction: 0.048
  hit_and_run_lifetime_s: {min: 0.3, max: 2.6}

  # Per-flow wall-clock lifetime by family (decides whether a rule installed
  # after detection still lands before the flow ends).
  flow_lifetime_s:
    volumetric: 45.0
    low_rate: 55.0
    benign: 12.0
    horizontal_probe: 8.0

  # Containment response latency is MEASURED per flow as:
  #   T_resp = polling_wait + extraction_time + install_time
  latency_model:
    polling_wait_bound_s: 3.0                     # detection cannot precede the next 3 s poll
    extraction_time_s: {mean: 0.20, std: 0.05}   # feature computation + RF inference
    install_time_s:                              # OpenFlow write time per rule kind (incl. TCAM write)
      BLOCK:      {mean: 0.40, std: 0.09}
      QUARANTINE: {mean: 0.58, std: 0.13}
      RATE_LIMIT: {mean: 0.85, std: 0.17}
      MONITOR:    {mean: 0.15, std: 0.04}
  # Per-strategy response-time centres, reported as a diagnostic distribution only.
  strategy_response_s:
    BLOCK: 1.4
    QUARANTINE: 2.2
    RATE_LIMIT: 3.0
    MONITOR: 4.1

# -----------------------------------------------------------------------------
# Network Service Availability model
# -----------------------------------------------------------------------------
availability:
  # A legitimate business connection throttled to the 100 Kbps containment meter
  # is not "fully functional"; count it toward unavailability.
  rate_limit_impairment_weight: 1.0
  # Depth of the transient availability dip while an attack burst is still
  # un-contained and saturating the attacker's edge switch.
  transient_degrade_factor: 0.35

# -----------------------------------------------------------------------------
# Physical / operational constraints (reported; also feed the MOOP utility)
# -----------------------------------------------------------------------------
constraints:
  tcam_capacity_Mmax: 4000
  containment_latency_max_s: 5.0
  controller_cpu_load_max: 0.80
  lctrl_intercept: 0.246                 # L_ctrl(t) = 0.246 + 0.00454 * N_rules(t)
  lctrl_slope: 0.00454
  lctrl_Lmax: 1.0
  action_domain: [0, 1, 2, 3]

# -----------------------------------------------------------------------------
# Containment policy resolution
# -----------------------------------------------------------------------------
#   algorithm1     -> critical->meter, lateral->VLAN 99, else->drop@200
#   severity_tiers -> resolve every compromised flow by severity S_k
#   hybrid         -> critical/lateral routing kept, the rest by severity tiers
policy:
  mode: "hybrid"

# -----------------------------------------------------------------------------
# Host Threat Risk Score  R_i(t) = [w_rf*P_attack + w1*d1 + w2*d2 + w3*d3] * 100
# -----------------------------------------------------------------------------
risk_engine:
  w_rf: 0.70                    # weight on the RF attack probability
  w1: 0.15                      # weight on the traffic-volume-spike signal
  w2: 0.10                      # weight on the port-scan signal
  w3: 0.05                      # weight on the auth-failure signal
  # Host state x_i(t) in {0 Clean, 1 Suspected, 2 Compromised}
  risk_suspected_threshold: 18.0   # R_i in [18, 60) -> Suspected: precautionary rate-limit of RF-flagged flows
  risk_threshold: 60.0             # R_i >= 60      -> Compromised: full DMCA enforcement
  scan_cap: 8.0                    # distinct destinations that saturate the port-scan signal
  auth_cap: 5.0                    # failed-auth events that saturate the auth-failure signal
  host_p_attack_aggregation: "mean_max_blend"   # P_attack(h_i) = 0.5*mean + 0.5*max over the host's flows this poll
  host_collateral_on_compromise: false          # do not sweep clean flows off a Compromised host

# -----------------------------------------------------------------------------
# Multi-Objective Optimisation utility (reported per trial as a diagnostic)
#   Phi(C) = alpha*tau - beta*fcr + gamma*avail - delta*lambda
# -----------------------------------------------------------------------------
moop:
  alpha: 0.40
  beta: 0.30
  gamma: 0.20
  delta: 0.10
  role: "diagnostic"

paths:
  results_dir: "results"
  figures_dir: "figures"
  model_dir: "results/model"
