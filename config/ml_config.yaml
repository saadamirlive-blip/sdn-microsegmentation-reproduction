# =============================================================================
# ml_config.yaml -- machine-learning pipeline configuration
#   Phase 1: dataset build   Phase 2: StandardScaler + RandomForest
# =============================================================================

model:
  estimator: "sklearn.ensemble.RandomForestClassifier"
  hyperparameters:
    n_estimators: 100
    max_depth: 12
    min_samples_split: 5
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1                  # runtime only; does not affect the fitted model
  # All other knobs stay at scikit-learn 1.2.2 defaults (criterion='gini',
  # max_features='sqrt', bootstrap=True). No hyper-parameter search.
  hyperparameter_search: false

preprocessing:
  scaler: "sklearn.preprocessing.StandardScaler"   # z = (x - mu) / sigma
  fit_on: "train_only"          # leakage guard: fit on TRAIN, transform TEST
  artifact_scaler: "results/model/scaler.pkl"
  artifact_model: "results/model/model.pkl"

features:
  order: [pps, bps, duration, tcp_ratio, udp_ratio, icmp_ratio]

# =============================================================================
# Synthetic flow-feature generative model (Phase 1)
# -----------------------------------------------------------------------------
# Fixed per-class rate distributions:
#   benign:  pps ~ N(0.2, 0.05)   bps ~ N(0.1, 0.02)
#   attack:  pps ~ N(3.0, 0.5)    bps ~ N(1.5, 0.3)
# (normalised units). The remaining features (duration, protocol ratios) and
# the class-overlap mechanisms below are engineering choices that model real
# enterprise-traffic behaviour; they are set once and left fixed. `duration` is
# in the same normalised unit family; the three ratios are renormalised to sum
# to 1 per sample.
# =============================================================================
synthetic_features:
  pps:   { benign: {mean: 0.2, std: 0.05}, attack: {mean: 3.0, std: 0.5} }
  bps:   { benign: {mean: 0.1, std: 0.02}, attack: {mean: 1.5, std: 0.3} }

  duration:
    benign: {mean: 1.00, std: 0.35, min: 0.05}
    # vector-specific: floods are short bursts, Slowloris holds connections open
    attack_by_vector:
      syn_flood:  {mean: 0.25, std: 0.10, min: 0.02}
      udp_flood:  {mean: 0.25, std: 0.10, min: 0.02}
      icmp_flood: {mean: 0.20, std: 0.08, min: 0.02}
      mixed_ddos: {mean: 0.30, std: 0.15, min: 0.02}
      slowloris:  {mean: 3.50, std: 1.20, min: 0.50}
      http_flood: {mean: 0.80, std: 0.40, min: 0.05}
      horizontal_probe: {mean: 0.15, std: 0.06, min: 0.02}

  # protocol mix: Dirichlet concentration per class/vector (higher -> dominates)
  protocol_mix:
    benign:            {tcp: 6.0, udp: 3.0, icmp: 1.0}
    syn_flood:         {tcp: 30.0, udp: 0.3, icmp: 0.2}
    udp_flood:         {tcp: 0.3, udp: 30.0, icmp: 0.2}
    icmp_flood:        {tcp: 0.2, udp: 0.3, icmp: 30.0}
    mixed_ddos:        {tcp: 8.0, udp: 8.0, icmp: 6.0}
    slowloris:         {tcp: 25.0, udp: 0.2, icmp: 0.1}
    http_flood:        {tcp: 25.0, udp: 0.3, icmp: 0.1}
    horizontal_probe:  {tcp: 12.0, udp: 2.0, icmp: 3.0}

  # low-rate L7 attacks sit close to the benign rate regime
  low_rate_pps_scale: 0.18
  low_rate_bps_scale: 0.25

  # Benign traffic = 2-component mixture. High-bandwidth iPerf3 inter-department
  # file transfers ("bursty") produce packet bursts inside a stats window that
  # momentarily raise the rate features; a sub-fraction ("heavy_spike") reach
  # close to the attack regime. This overlap is what makes the classes not
  # perfectly separable and drives the false-positive rate.
  benign_mixture:
    steady_fraction: 0.90
    bursty_fraction: 0.11            # file-transfer burst windows in the training set
    bursty_pps: {mean: 0.90, std: 0.45, min: 0.0001}
    bursty_bps: {mean: 0.55, std: 0.28, min: 0.0001}
    bursty_duration: {mean: 1.6, std: 0.7, min: 0.05}
    heavy_spike_fraction: 0.46       # of the bursty component
    heavy_spike_pps: {mean: 2.55, std: 0.88, min: 0.0001}
    heavy_spike_bps: {mean: 1.28, std: 0.44, min: 0.0001}

  # a stealthy sub-fraction of Slowloris/HTTP-flood flows sit on top of benign HTTP
  low_rate_stealth_fraction: 0.205

  # ~1.5% telemetry quantisation / timing noise on every feature
  feature_jitter_std: 0.015

# Per-vector share of the 25,000 malicious training samples (sums to 1.0).
malicious_sample_shares:
  syn_flood: 0.35
  udp_flood: 0.25
  icmp_flood: 0.15
  mixed_ddos: 0.12
  slowloris: 0.08
  http_flood: 0.05
