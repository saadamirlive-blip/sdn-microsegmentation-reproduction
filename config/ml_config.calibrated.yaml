# =============================================================================
# ml_config.calibrated.yaml  --  OVERLAY for SDN_CONFIG_SET=calibrated
# =============================================================================
# Deep-merged onto config/ml_config.yaml. ONLY the [ASSUMPTION] feature-model
# keys that were CALIBRATED so the classifier's operating point matches the
# paper (offline ~99.77%, 15 FP / 20 FN; system FPR 1.2%).
#
# NOT a reproduction -- a fit. See CALIBRATION.md.
# =============================================================================

synthetic_features:
  # ~1% -> ~1.8% telemetry jitter: classes less perfectly separable, so the
  # offline confusion matrix moves toward the paper's 15 FP / 20 FN.
  feature_jitter_std: 0.015

  low_rate_stealth_fraction: 0.205           # was 0.15 -> a few more low-rate FNs

  benign_mixture:
    bursty_fraction: 0.11                    # was 0.10 (training set)
    # the heavy transfer spikes sit closer to (and overlap) the attack regime,
    # which is what drives the online FPR up to ~1.2% (Sec VI.B.7 mechanism).
    heavy_spike_fraction: 0.46               # was 0.25
    heavy_spike_pps: {mean: 2.55, std: 0.88, min: 0.0001}   # was 2.05/0.75
    heavy_spike_bps: {mean: 1.28, std: 0.44, min: 0.0001}   # was 1.05/0.40
