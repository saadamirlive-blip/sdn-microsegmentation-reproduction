name: reproduce

# Runs the full pure-Python reconstruction on GitHub's Ubuntu runners with the
# paper-pinned scientific stack (numpy 1.24.3 / pandas 2.0.1 / scikit-learn 1.2.2
# on Python 3.10), for BOTH config sets:
#   * paper       -- the faithful reproduction  -> results/
#   * calibrated  -- the fitted model           -> results_calibrated/
# Uploads results + figures as artifacts and prints both comparison tables to
# the job summary.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10 (paper spec)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install paper-pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify environment vs paper pins
        run: python scripts/verify_env.py

      - name: Unit tests
        run: pytest -q

      - name: Run reproduction (paper config set)
        run: python run_experiment.py

      - name: Run calibrated fit
        run: python run_experiment.py --config-set calibrated

      - name: Comparison tables -> job summary
        if: always()
        run: |
          {
            echo '## Reproduction vs paper (paper config set)'
            echo '```'
            python - <<'PY'
          import pandas as pd
          d = pd.read_csv("results/reproduction_comparison.csv")
          print(d[["metric","paper_result","reproduced_result","absolute_difference","status"]].to_string(index=False))
          print()
          print(d.status.value_counts().to_dict())
          PY
            echo '```'
            echo '## Calibrated fit vs paper (calibrated config set)'
            echo '```'
            python - <<'PY'
          import pandas as pd
          d = pd.read_csv("results_calibrated/reproduction_comparison.csv")
          print(d[["metric","paper_result","reproduced_result","absolute_difference","status"]].to_string(index=False))
          print()
          print(d.status.value_counts().to_dict())
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results + figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-results
          path: |
            results/**
            results_calibrated/**
            figures/**
            figures_calibrated/**
          retention-days: 30
